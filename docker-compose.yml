services:
  db:
    image: postgres:16-alpine
    container_name: sweets-lp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sweets
      POSTGRES_PASSWORD: sweets_password
      POSTGRES_DB: sweets_lp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweets -d sweets_lp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./frontend
    container_name: sweets-lp-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sweets:sweets_password@db:5432/sweets_lp?schema=public
      ADMIN_PASSWORD: change-me
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - uploads:/app/public/uploads
    command: npm run dev

volumes:
  postgres-data:
  uploads:
